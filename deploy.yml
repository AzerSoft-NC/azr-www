stack: default
docker:
  files: ['docker/Dockerfile']
  compose: './docker-compose.yml'
commands:
  format: ['yarn prettier --write .']
  check: ['yarn lint', 'yarn astro:check']
  test: ['yarn test']
  build: ['yarn build']
local:
  env_file: .env
prod:
  droplet: ubuntu-azr-1
  env_file: .env.prod
