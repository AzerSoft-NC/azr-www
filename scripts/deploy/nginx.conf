server {
  listen 80;
  server_name azersoft.nc www.azersoft.nc;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name azersoft.nc www.azersoft.nc;

  root /var/www/azersoft;
  index index.html;

  ssl_certificate /etc/letsencrypt/live/azersoft.nc/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/azersoft.nc/privkey.pem;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self';" always;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    expires 5m;
    add_header Cache-Control "public";
    try_files $uri $uri.html $uri/ =404;
  }
}
